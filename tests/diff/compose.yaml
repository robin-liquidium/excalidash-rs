# Differential test stacks: upstream Node (nginx+backend) vs Rust (single container).
# Both start from empty throwaway volumes with identical settings.
name: exrs-diff
x-common-env: &common
  NODE_ENV: production
  AUTH_MODE: local
  TRUST_PROXY: "1"
  JWT_SECRET: diff-jwt-secret-0123456789abcdef0123456789abcdef
  CSRF_SECRET: diff-csrf-secret-0123456789abcdef
  API_KEY_HASH_PEPPER: diff-pepper
  UPDATE_CHECK_OUTBOUND: "false"
  CSRF_MAX_REQUESTS: "100000"
  RATE_LIMIT_MAX_REQUESTS: "100000"
  ENABLE_AUDIT_LOGGING: "true"
  SNAPSHOT_RETENTION_DAYS: "2"
services:
  node-backend:
    image: zimengxiong/excalidash-backend:0.6.5
    init: true
    environment:
      <<: *common
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/app/prisma/dev.db
      PORT: "8000"
      FRONTEND_URL: http://127.0.0.1:16801
    volumes: [node-data:/app/prisma]
  node-frontend:
    image: zimengxiong/excalidash-frontend:0.6.5
    environment:
      BACKEND_URL: node-backend:8000
    depends_on: [node-backend]
    ports: ["127.0.0.1:16801:8080"]
  rust:
    image: ${RUST_IMAGE:-excalidash-rs:dev}
    environment:
      <<: *common
      FRONTEND_URL: http://127.0.0.1:16802
    volumes: [rust-data:/app/prisma]
    ports: ["127.0.0.1:16802:8080"]
volumes:
  node-data: {}
  rust-data: {}
