[package]
name = "excalidash-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "multipart", "original-uri", "matched-path"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
hyper = { version = "1.12.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "builder", "tokio1-rustls", "ring", "webpki-roots"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
percent-encoding = "2.3.2"
postgres = { version = "0.19.14", features = ["with-chrono-0_4"], optional = true }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled", "blob", "backup"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusty-s3 = "0.10.2"
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
socketioxide = { version = "0.18.7", features = ["state", "extensions"] }
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "signal", "fs", "io-util"] }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
webpki-roots = "1.0.9"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }

# Vendored hyper with two small patches (see vendor/README.md): public HeaderCaseMap for
# exact header-name spellings, and explicit `Content-Length: 0` kept on 204 responses.
[patch.crates-io]
hyper = { path = "vendor/hyper" }

[features]
default = []
# PostgreSQL support (DATABASE_URL=postgresql://…), off by default to keep the SQLite build lean.
postgres = ["dep:postgres", "dep:tokio-postgres-rustls"]
